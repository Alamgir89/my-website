<style>
/* --- Tiny Space Hacks Responsive Fix - No design change, only layout --- */
html, body { max-width: 100%; overflow-x: hidden; }
img, video { max-width: 100%; height: auto; }

/* Force containers to be fluid */
.container { width: 100% !important; max-width: 100% !important; padding-left: 16px; padding-right: 16px; }

/* Fix fixed pixel widths that break mobile */
@media (max-width: 640px) {
  [class*="w-[380px]"], [class*="w-[420px]"], [class*="w-[320px]"], [class*="w-[260px]"], [class*="w-[200px]"] {
    width: 100% !important;
    max-width: 100% !important;
  }
  [class*="h-[380px]"], [class*="h-[420px]"], [class*="h-[320px]"], [class*="h-[280px]"], [class*="h-[260px]"] {
    height: auto !important;
  }
  /* Header pills that overlapped */
  .absolute { position: relative !important; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; transform: none !important; }
  /* Make top bar stack */
  .flex { flex-wrap: wrap !important; }
  h1, h2, h3 { word-break: break-word; }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .container { max-width: 95% !important; }
  [class*="w-[420px]"] { width: 100% !important; max-width: 380px !important; }
}

@media (min-width: 1025px) and (max-width: 1440px) {
  .container { max-width: 1024px !important; }
}

@media (min-width: 1441px) {
  .container { max-width: 1280px !important; }
  body { font-size: 18px; }
}

/* Ensure grid becomes responsive */
.grid { width: 100%; }
@media (max-width: 768px) {
  .grid-cols-3 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
}
@media (min-width: 769px) and (max-width: 1024px) {
  .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}
</style>

<script>
(function(){
  function setupProductDescToggle(){
    document.querySelectorAll('.card-white').forEach(function(card){
      // Avoid double processing
      if(card.dataset.descSetup === '1') return;
      
      // Find title
      var titleEl = card.querySelector('h3');
      if(!titleEl) return;
      
      // Find description - it's the p with longer text near title
      var descEl = null;
      var allP = card.querySelectorAll('p');
      for(var i=0; i<allP.length; i++){
        var p = allP[i];
        if(p.dataset.isProductDesc) continue;
        var txt = (p.textContent || '').trim();
        // Product descriptions are longer than 50 chars
        if(txt.length > 50 && txt.split(' ').length > 8){
          // Make sure it's not a small label
          if(!p.classList.contains('line-clamp-1') || txt.length > 80){
            // Check if parent is same as title parent or close
            descEl = p;
            break;
          }
        }
      }
      // Fallback: try to find p.text-[#7A5B8A]
      if(!descEl){
        descEl = card.querySelector('p.text-\[\#7A5B8A\]');
      }
      if(!descEl) return;
      if(descEl.dataset.isProductDesc === '1') return;

      // Mark as processed
      descEl.dataset.isProductDesc = '1';
      card.dataset.descSetup = '1';

      // Hide description initially
      descEl.classList.add('product-desc-hidden');
      descEl.classList.remove('product-desc-visible');

      // Create 3D button
      var btn = document.createElement('button');
      btn.className = 'btn-product-desc-3d';
      btn.innerHTML = '📦 Product Description <span style="font-size:10px; margin-left:4px;">▼</span>';
      btn.type = 'button';
      
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        var isHidden = descEl.classList.contains('product-desc-hidden');
        if(isHidden){
          descEl.classList.remove('product-desc-hidden');
          descEl.classList.add('product-desc-visible');
          btn.innerHTML = '📦 Hide Description <span style="font-size:10px; margin-left:4px;">▲</span>';
        } else {
          descEl.classList.remove('product-desc-visible');
          descEl.classList.add('product-desc-hidden');
          btn.innerHTML = '📦 Product Description <span style="font-size:10px; margin-left:4px;">▼</span>';
        }
      });

      // Insert button right after title
      titleEl.insertAdjacentElement('afterend', btn);
    });
  }

  // Run after page loads
  setTimeout(setupProductDescToggle, 800);
  setTimeout(setupProductDescToggle, 2000);
  setTimeout(setupProductDescToggle, 3500);

  // Watch for dynamic content (React re-renders)
  var observer = new MutationObserver(function(mutations){
    var shouldRun = false;
    mutations.forEach(function(m){
      if(m.addedNodes && m.addedNodes.length > 0) shouldRun = true;
    });
    if(shouldRun) setupProductDescToggle();
  });
  observer.observe(document.body, {childList: true, subtree: true});
})();
</script>


<script>
(function(){
  function initCanvas(id){
    const canvas=document.getElementById(id); if(!canvas) return;
    const ctx=canvas.getContext('2d'); let w,h,cx,cy;
    function resize(){w=canvas.width=canvas.parentElement?canvas.parentElement.offsetWidth:window.innerWidth; h=canvas.height=canvas.parentElement?canvas.parentElement.offsetHeight:900; if(h<500)h=900; cx=w/2; cy=h/2;}
    window.addEventListener('resize',resize); resize();
    const particles=[]; const total=900;
    function reset(init=false){const a=Math.random()*Math.PI*2; const r=Math.random()*400+20; return {x:Math.cos(a)*r,y:Math.sin(a)*r,z:init?Math.random()*2000:2000,size:Math.random()*2+0.5,hue:Math.random()*360};}
    for(let i=0;i<total;i++) particles.push(reset(true));
    let time=0;
    function animate(){
      const c=document.getElementById(id); if(!c||c!==canvas) return;
      time+=0.01; ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,0,w,h);
      particles.forEach((p,i)=>{p.z-=15; if(p.z<=1) Object.assign(p,reset()); const s=800/p.z; const x=cx+p.x*s+Math.sin(time+i)*10; const y=cy+p.y*s+Math.cos(time+i)*10; const r=p.size*s; const g=ctx.createRadialGradient(x,y,0,x,y,r*4); g.addColorStop(0,`hsla(${(p.hue+time*200)%360},100%,70%,1)`); g.addColorStop(1,'transparent'); ctx.beginPath(); ctx.fillStyle=g; ctx.arc(x,y,r*4,0,Math.PI*2); ctx.fill();});
      for(let i=0;i<6;i++){const d=(time*400+i*250)%2000; const s=800/(2000-d+1); const rad=220*s; ctx.beginPath(); ctx.lineWidth=2*s; ctx.strokeStyle=`hsla(${(time*100+i*60)%360},100%,60%,0.7)`; ctx.ellipse(cx,cy,rad*1.2,rad,time+i,0,Math.PI*2); ctx.stroke();}
      requestAnimationFrame(animate);
    }
    animate();
  }
  function check(){const h=window.location.hash.replace('#',''); if(h==='signup') setTimeout(()=>initCanvas('c-signup'),200); if(h==='login') setTimeout(()=>initCanvas('c-login'),200);}
  window.addEventListener('hashchange',check); setTimeout(check,800);
  setTimeout(()=>{initCanvas('c-signup'); initCanvas('c-login');},1000);
})();
</script>


<script id="product-analytics-script">
(function(){
  // Helper to generate product ID from card
  function getProductId(card, index){
    var titleEl = card.querySelector('h3');
    var title = titleEl ? (titleEl.textContent || '').trim() : 'product-'+index;
    // Create slug from title
    var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').substring(0,40);
    if(!slug) slug = 'product-'+index;
    return slug + '-' + index;
  }

  function getCount(key, id){
    try {
      return parseInt(localStorage.getItem(key+'_'+id) || '0');
    } catch(e){ return 0; }
  }

  function setCount(key, id, val){
    try { localStorage.setItem(key+'_'+id, val); } catch(e){}
  }

  function incrementCount(key, id){
    var c = getCount(key, id) + 1;
    setCount(key, id, c);
    return c;
  }

  // Check if visit is from Pinterest
  function isFromPinterest(){
    try {
      var ref = document.referrer || '';
      var urlParams = new URLSearchParams(window.location.search);
      var utm = urlParams.get('utm_source') || urlParams.get('source') || '';
      var pin = urlParams.get('pin') || urlParams.get('pinterest') || '';
      return ref.includes('pinterest.com') || ref.includes('pin.it') || utm.toLowerCase().includes('pinterest') || !!pin;
    } catch(e){ return false; }
  }

  function setupAnalytics(){
    var cards = document.querySelectorAll('.card-white');
    if(cards.length === 0){
      // Try alternative selectors
      cards = document.querySelectorAll('[class*="card"]');
    }
    
    var fromPinterest = isFromPinterest();
    var urlParams = new URLSearchParams(window.location.search);
    var productParam = urlParams.get('product') || urlParams.get('pin') || urlParams.get('p') || '';

    cards.forEach(function(card, idx){
      if(card.dataset.analyticsSetup === '1') return;
      
      var productId = getProductId(card, idx);
      
      // Skip if not a product card (no title or too small)
      var titleEl = card.querySelector('h3');
      if(!titleEl) return;
      var titleText = (titleEl.textContent || '').trim();
      if(titleText.length < 3) return;

      // Check if already has analytics bar
      if(card.querySelector('.product-analytics-bar')) return;

      card.dataset.analyticsSetup = '1';

      // Get counts
      var likeCount = getCount('like', productId);
      var commentCount = getCount('comment', productId);
      var viewCount = getCount('view', productId);
      var clickCount = getCount('click', productId);
      var pinterestCount = getCount('pinterest', productId);
      var amazonClickCount = getCount('amazon_click', productId);

      // If from Pinterest, increment Pinterest count for this product (or for product matching param)
      if(fromPinterest){
        // If URL has product param, only increment for matching product
        if(productParam){
          var normalizedTitle = titleText.toLowerCase().replace(/[^a-z0-9]/g, '');
          var normalizedParam = productParam.toLowerCase().replace(/[^a-z0-9]/g, '');
          if(normalizedTitle.includes(normalizedParam) || normalizedParam.includes(normalizedTitle.substring(0,10)) || idx === 0){
            var newPinterest = incrementCount('pinterest', productId);
            pinterestCount = newPinterest;
            // Also increment view for Pinterest traffic
            var newView = incrementCount('view', productId);
            viewCount = newView;
          }
        } else {
          // If no specific product param but from Pinterest, increment for first product or for all visible
          // We'll increment for this card if it's in viewport or first few
          if(idx < 3){
            var newPinterest = incrementCount('pinterest', productId);
            pinterestCount = newPinterest;
          }
        }
      }

      // Create analytics bar
      var bar = document.createElement('div');
      bar.className = 'product-analytics-bar';
      bar.innerHTML = `
        <button class="analytics-btn analytics-btn-like" data-action="like" data-id="${productId}">
          <span>❤️</span> <span>Like</span> <span class="analytics-count like-count">${likeCount}</span>
        </button>
        <button class="analytics-btn analytics-btn-comment" data-action="comment" data-id="${productId}">
          <span>💬</span> <span>Comment</span> <span class="analytics-count comment-count">${commentCount}</span>
        </button>
        <button class="analytics-btn analytics-btn-view" data-action="view" data-id="${productId}">
          <span>👁️</span> <span>View</span> <span class="analytics-count view-count">${viewCount}</span>
        </button>
        <button class="analytics-btn analytics-btn-click" data-action="amazon" data-id="${productId}">
          <span>🛒</span> <span>Click</span> <span class="analytics-count click-count">${amazonClickCount}</span>
        </button>
      `;

      // Create badges for Pinterest and Amazon tracking (visible to all visitors)
      var badgeContainer = document.createElement('div');
      badgeContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;';
      badgeContainer.innerHTML = `
        <div class="pinterest-badge" data-id="${productId}">
          <span>📌</span> Pinterest থেকে <span class="pinterest-count">${pinterestCount}</span> জন এসেছে
        </div>
        <div class="amazon-badge" data-id="${productId}">
          <span>➡️</span> Amazon এ <span class="amazon-click-count">${amazonClickCount}</span> জন গেছে
        </div>
      `;

      // Comment box
      var commentBox = document.createElement('div');
      commentBox.className = 'comment-box';
      commentBox.dataset.id = productId;
      commentBox.innerHTML = `
        <input type="text" class="comment-input" placeholder="কমেন্ট লিখুন... Enter চাপুন" data-id="${productId}">
        <div class="comment-list" data-id="${productId}"></div>
      `;

      // Find best place to insert: after product description button or at end of card
      var insertAfter = card.querySelector('.btn-product-desc-3d') || card.querySelector('h3') || card.lastElementChild;
      if(insertAfter && insertAfter.parentNode){
        if(insertAfter.nextSibling){
          insertAfter.parentNode.insertBefore(bar, insertAfter.nextSibling);
          bar.parentNode.insertBefore(badgeContainer, bar.nextSibling);
          badgeContainer.parentNode.insertBefore(commentBox, badgeContainer.nextSibling);
        } else {
          card.appendChild(bar);
          card.appendChild(badgeContainer);
          card.appendChild(commentBox);
        }
      } else {
        card.appendChild(bar);
        card.appendChild(badgeContainer);
        card.appendChild(commentBox);
      }

      // Load existing comments
      try {
        var comments = JSON.parse(localStorage.getItem('comments_'+productId) || '[]');
        var listEl = commentBox.querySelector('.comment-list');
        if(listEl && comments.length > 0){
          listEl.innerHTML = comments.slice(-5).map(function(c){ return '<div class="comment-item">💬 '+c+'</div>'; }).join('');
        }
      } catch(e){}

      // Event listeners
      bar.querySelector('[data-action="like"]').addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var btn = this;
        var id = btn.dataset.id;
        var isLiked = btn.classList.contains('liked') || localStorage.getItem('liked_'+id) === '1';
        var countEl = btn.querySelector('.like-count');
        if(!isLiked){
          var newCount = incrementCount('like', id);
          countEl.textContent = newCount;
          btn.classList.add('liked');
          localStorage.setItem('liked_'+id, '1');
          btn.style.transform = 'scale(1.2)';
          setTimeout(function(){ btn.style.transform = 'scale(1)'; }, 200);
        } else {
          // Unlike
          var current = getCount('like', id);
          if(current > 0){
            setCount('like', id, current-1);
            countEl.textContent = current-1;
          }
          btn.classList.remove('liked');
          localStorage.removeItem('liked_'+id);
        }
      });

      bar.querySelector('[data-action="comment"]').addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var id = this.dataset.id;
        var box = document.querySelector('.comment-box[data-id="'+id+'"]');
        if(box){
          box.classList.toggle('active');
          if(box.classList.contains('active')){
            box.querySelector('.comment-input').focus();
          }
        }
      });

      commentBox.querySelector('.comment-input').addEventListener('keypress', function(e){
        if(e.key === 'Enter'){
          var text = this.value.trim();
          if(!text) return;
          var id = this.dataset.id;
          try {
            var comments = JSON.parse(localStorage.getItem('comments_'+id) || '[]');
            comments.push(text);
            localStorage.setItem('comments_'+id, JSON.stringify(comments));
            var newCommentCount = incrementCount('comment', id);
            // Update comment count in bar
            var card = this.closest('.card-white') || this.closest('[data-analytics-setup]');
            if(card){
              var countEl = card.querySelector('.comment-count');
              if(countEl) countEl.textContent = newCommentCount;
            }
            // Add to list
            var listEl = commentBox.querySelector('.comment-list');
            var item = document.createElement('div');
            item.className = 'comment-item';
            item.textContent = '💬 ' + text;
            listEl.appendChild(item);
            this.value = '';
          } catch(err){}
        }
      });

      // View tracking with IntersectionObserver
      if('IntersectionObserver' in window){
        var observer = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              var c = entry.target;
              var id = c.dataset.analyticsId || productId;
              if(!c.dataset.viewed){
                c.dataset.viewed = '1';
                c.dataset.analyticsId = id;
                var newView = incrementCount('view', id);
                var viewEl = c.querySelector('.view-count');
                if(viewEl) viewEl.textContent = newView;
              }
            }
          });
        }, {threshold: 0.3});
        observer.observe(card);
      } else {
        // Fallback: count view on load
        var newView = incrementCount('view', productId);
        var viewEl = bar.querySelector('.view-count');
        if(viewEl) viewEl.textContent = newView;
      }

      // Amazon click tracking - find Amazon links
      var amazonLinks = card.querySelectorAll('a[href*="amazon.com"], a[href*="amzn.to"], button');
      amazonLinks.forEach(function(link){
        // Check if it's an Amazon-related button
        var text = (link.textContent || '').toLowerCase();
        var href = link.getAttribute('href') || '';
        if(href.includes('amazon') || text.includes('amazon') || text.includes('shop now') || text.includes('buy now') || link.classList.contains('btn-product-desc-3d') === false && (text.includes('shop') || text.includes('amazon'))){
          // Only track actual Amazon outbound clicks, not description toggles
          if(link.classList.contains('btn-product-desc-3d')) return;
          if(text.includes('product description')) return;
          
          link.addEventListener('click', function(e){
            var id = productId;
            // Don't prevent default, just track
            var newAmazonClick = incrementCount('amazon_click', id);
            var newClick = incrementCount('click', id);
            // Update UI
            var clickEl = card.querySelector('.click-count');
            var amazonCountEl = card.querySelector('.amazon-click-count');
            var amazonBadgeCount = card.querySelector('.amazon-click-count');
            if(clickEl) clickEl.textContent = newAmazonClick;
            if(amazonCountEl) amazonCountEl.textContent = newAmazonClick;
            // Also update badge
            var badges = card.querySelectorAll('.amazon-badge .amazon-click-count');
            badges.forEach(function(b){ b.textContent = newAmazonClick; });
          });
        }
      });

      // Also track Shop Now Amazon buttons more specifically
      var shopButtons = card.querySelectorAll('a, button');
      shopButtons.forEach(function(btn){
        var t = (btn.textContent || '').toLowerCase();
        if(t.includes('shop') && t.includes('amazon') || t.includes('amazon') && (t.includes('now') || t.includes('buy'))){
          btn.addEventListener('click', function(){
            var id = productId;
            var newAmazonClick = incrementCount('amazon_click', id);
            incrementCount('click', id);
            var els = card.querySelectorAll('.amazon-click-count, .click-count');
            els.forEach(function(el){ el.textContent = newAmazonClick; });
          });
        }
      });
    });

    // Global Pinterest detection - if from Pinterest, show notification
    if(fromPinterest){
      console.log('Visitor from Pinterest detected');
      // Increment global Pinterest counter
      var globalPinterest = getCount('global', 'pinterest_visits') + 1;
      setCount('global', 'pinterest_visits', globalPinterest);
    }

    // Add global stats bar at top of shop page (visible to all visitors)
    var shopContainer = document.querySelector('#page-shop') || document.body;
    if(shopContainer && !document.getElementById('global-analytics-stats')){
      var globalStats = document.createElement('div');
      globalStats.id = 'global-analytics-stats';
      globalStats.style.cssText = 'margin:16px;padding:12px 16px;background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-radius:16px;border:1px solid #FDE68A;display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:700;';
      var totalPinterest = 0, totalAmazon = 0, totalLikes = 0, totalViews = 0;
      try {
        // Sum up all product stats
        for(var i=0; i<localStorage.length; i++){
          var key = localStorage.key(i);
          if(key && key.startsWith('pinterest_')) totalPinterest += parseInt(localStorage.getItem(key)||'0');
          if(key && key.startsWith('amazon_click_')) totalAmazon += parseInt(localStorage.getItem(key)||'0');
          if(key && key.startsWith('like_')) totalLikes += parseInt(localStorage.getItem(key)||'0');
          if(key && key.startsWith('view_')) totalViews += parseInt(localStorage.getItem(key)||'0');
        }
      } catch(e){}
      globalStats.innerHTML = `
        <div style="display:flex;align-items:center;gap:6px;"><span>📌</span> Pinterest থেকে মোট <span style="color:#E11D48;">${totalPinterest}</span> জন এসেছে</div>
        <div style="display:flex;align-items:center;gap:6px;"><span>➡️</span> Amazon এ মোট <span style="color:#D97706;">${totalAmazon}</span> জন গেছে</div>
        <div style="display:flex;align-items:center;gap:6px;"><span>❤️</span> মোট <span style="color:#FF4B7A;">${totalLikes}</span> লাইক</div>
        <div style="display:flex;align-items:center;gap:6px;"><span>👁️</span> মোট <span style="color:#16A34A;">${totalViews}</span> ভিউ</div>
      `;
      // Insert after banner
      var banner = document.querySelector('.relative.w-full.h-\[72px\]') || document.querySelector('h2');
      if(banner && banner.parentNode && banner.parentNode.parentNode){
        banner.parentNode.parentNode.insertBefore(globalStats, banner.parentNode.nextSibling);
      } else if(shopContainer.firstChild){
        shopContainer.insertBefore(globalStats, shopContainer.firstChild);
      }
    }
  }

  // Run setup after page loads
  function init(){
    // Inject CSS if not already
    if(!document.getElementById('product-analytics-style')){
      var styleEl = document.createElement('div');
      styleEl.innerHTML = `

<script id="alamgir-video-patch">
(function(){
  function isVideoSrc(src){
    if(!src) return false;
    var s = src.toLowerCase();
    return s.indexOf('data:video')===0 || s.indexOf('.mp4')>-1 || s.indexOf('.webm')>-1 || s.indexOf('.mov')>-1 || s.indexOf('.ogg')>-1;
  }

  // 2. আপলোড বাটন থেকে ভিডিও আপলোড
  function fixFileInputs(){
    document.querySelectorAll('input[type="file"]').forEach(function(inp){
      var acc = (inp.getAttribute('accept')||'').toLowerCase();
      if(acc.indexOf('image')>-1){
        inp.setAttribute('accept','image/*,video/*');
      }
    });
  }

  function patchAdminPreview(){
    // Admin panel preview - if preview src is video, replace img with video
    document.querySelectorAll('img[alt="preview"]').forEach(function(img){
      var src = img.getAttribute('src')||'';
      if(isVideoSrc(src) && !img.dataset.videoPatched){
        img.dataset.videoPatched='1';
        var vid = document.createElement('video');
        vid.src = src;
        vid.controls = true;
        vid.className = img.className;
        vid.style.cssText = img.style.cssText + ';background:#000;';
        vid.setAttribute('playsinline','');
        img.parentNode.replaceChild(vid, img);
      }
    });
  }

  function patchCards(){
    // প্রতিটা প্রোডাক্ট কার্ড
    document.querySelectorAll('.group.card-white').forEach(function(card){
      if(card.dataset.alamgirPatched==='1') {
        // still need to check if new img added
      }
      var img = card.querySelector('img.w-full');
      if(!img) return;
      var src = img.getAttribute('src')||'';
      
      // 1. ছবি ফুল সাইজ CSS
      if(!isVideoSrc(src)){
        img.style.height='auto';
        img.style.objectFit='contain';
        img.style.maxHeight='800px';
        img.style.width='100%';
        img.style.display='block';
      }

      // 2. ভিডিও হলে
      if(isVideoSrc(src) && !card.dataset.videoDone){
        card.dataset.videoDone='1';
        // parent <a> টা খুঁজে বের করো যেটা Amazon এ নিয়ে যায়
        var linkEl = img.closest('a[href]');
        var amazonHref = linkEl ? linkEl.getAttribute('href') : null;
        // Amazon লিংকটা কার্ডের ভেতরে অন্য জায়গায়ও থাকতে পারে (Shop button)
        if(!amazonHref){
          var shopBtn = card.querySelector('a[href*="amazon"], a[href*="amzn"]');
          if(shopBtn) amazonHref = shopBtn.getAttribute('href');
        }

        // img কে video দিয়ে replace
        var video = document.createElement('video');
        video.src = src;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.className = 'alamgir-video';
        video.style.width='100%';
        video.style.height='auto';
        video.style.display='block';
        // ক্লিক করলে Play/Pause
        video.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          if(video.paused) video.play(); else video.pause();
        });

        if(linkEl){
          // <a> কে <div> দিয়ে replace যাতে Amazon এ না যায়
          var div = document.createElement('div');
          div.className = linkEl.className;
          div.style.cssText = linkEl.style.cssText;
          // innerHTML copy না করে child move
          // প্রথমে video বসাই
          div.appendChild(video);
          // বাকি badge/label গুলো move করি
          while(linkEl.firstChild){
            // img টা already replaced, তাই skip
            var child = linkEl.firstChild;
            if(child===img || (child.tagName && child.tagName.toLowerCase()==='img')){
              linkEl.removeChild(child);
              continue;
            }
            div.appendChild(child);
          }
          linkEl.parentNode.replaceChild(div, linkEl);
        } else {
          img.parentNode.replaceChild(video, img);
        }

        // টাইটেলে ক্লিক করলে Amazon এ যাবে - h3 কে <a> দিয়ে wrap
        var titleEl = card.querySelector('h3');
        if(titleEl && amazonHref && !titleEl.closest('a[href]')){
          var a = document.createElement('a');
          a.href = amazonHref;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.style.display='block';
          a.style.textDecoration='none';
          titleEl.parentNode.insertBefore(a, titleEl);
          a.appendChild(titleEl);
        }
      }
    });
  }

  function runAll(){
    fixFileInputs();
    patchAdminPreview();
    patchCards();
    // ছবি ফুল সাইজ CSS নিশ্চিত
    document.querySelectorAll('.group img').forEach(function(img){
      var src = img.getAttribute('src')||'';
      if(!isVideoSrc(src)){
        img.style.height='auto';
        img.style.objectFit='contain';
      }
    });
  }

  // প্রথমবার
  setTimeout(runAll, 800);
  setTimeout(runAll, 2000);
  setTimeout(runAll, 3500);

  // React re-render ধরার জন্য MutationObserver
  var obs = new MutationObserver(function(mutations){
    var should = false;
    mutations.forEach(function(m){ if(m.addedNodes && m.addedNodes.length>0) should=true; });
    if(should) setTimeout(runAll, 300);
  });
  try { obs.observe(document.body, {childList:true, subtree:true}); } catch(e){}

  // file input change হলে আবার চেক
  document.addEventListener('change', function(e){
    if(e.target && e.target.type==='file') setTimeout(runAll, 500);
  }, true);

  console.log('Alamgir patch loaded: fullsize image + video support');
})();
</script>

<!-- FIX START: Pinterest UTM + Public products - Alamgir - Does NOT change design -->
<script id="alamgir-pinterest-fix">
(function(){
  try {
    var hasUTM = window.location.search.indexOf('utm_')>-1 || window.location.search.indexOf('pinterest')>-1;
    var hash = window.location.hash || '';
    // If came from Pinterest with UTM but no #shop, force #shop
    if(hasUTM && (!hash || hash==='' || hash==='#')){
      var newUrl = window.location.pathname + window.location.search + '#shop';
      history.replaceState(null, '', newUrl);
      hash = '#shop';
    }
    // If hash contains shop even with UTM ( ?utm...#shop ), make sure React navigates to shop
    if(window.location.href.indexOf('#shop')>-1 || hash.indexOf('shop')>-1){
      setTimeout(function(){
        window.dispatchEvent(new Event('hashchange'));
        // Try to force React state by setting hash again
        if(window.location.hash !== '#shop'){
          window.location.hash = 'shop';
        }
        var shopPage = document.getElementById('page-shop');
        if(shopPage) window.scrollTo({top:0, behavior:'smooth'});
      }, 600);
      setTimeout(function(){
        window.dispatchEvent(new Event('hashchange'));
      }, 1500);
    }
  } catch(e){ console.log('pinterest fix error', e); }
})();
</script>

<script id="alamgir-public-loader">
(function(){
  async function loadPublic(){
    try{
      // Try to load products.json from root (public file synced with GitHub)
      var res = await fetch('/products.json?v='+Date.now(), {cache:'no-store'});
      if(!res.ok) return;
      var remote = await res.json();
      if(!Array.isArray(remote) || remote.length===0) return;
      var localRaw = localStorage.getItem('alamgir_products');
      var local = [];
      try{ local = JSON.parse(localRaw||'[]'); }catch(e){}
      var isAdmin = false;
      try{ isAdmin = localStorage.getItem('alamgir_admin_auth')==='true'; }catch(e){}
      // For visitors, or if remote has more items, update localStorage
      if(!isAdmin || remote.length > local.length){
        // Only update if remote is different to avoid loop
        if(JSON.stringify(remote) !== localRaw){
          localStorage.setItem('alamgir_products', JSON.stringify(remote));
          console.log('✅ Public products loaded from GitHub:', remote.length);
          // Reload once if visitor to show new posts
          if(!isAdmin && local.length !== remote.length){
            if(!sessionStorage.getItem('public_reloaded')){
              sessionStorage.setItem('public_reloaded','1');
              window.location.reload();
            }
          }
        }
      }
    }catch(e){ console.log('public loader failed', e); }
  }
  setTimeout(loadPublic, 700);
  setTimeout(loadPublic, 2500);
})();
</script>

<script id="alamgir-github-sync">
(function(){
  // When admin saves a product, also push to GitHub via Netlify Function
  var GITHUB_SYNC_URL = '/.netlify/functions/save-products';
  var isSyncing = false;
  async function syncToGithub(){
    if(isSyncing) return;
    var isAdmin = false;
    try{ isAdmin = localStorage.getItem('alamgir_admin_auth')==='true'; }catch(e){}
    if(!isAdmin) return;
    try{
      isSyncing = true;
      var products = localStorage.getItem('alamgir_products');
      if(!products) return;
      var res = await fetch(GITHUB_SYNC_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({products: JSON.parse(products)})
      });
      var data = await res.json().catch(()=>({}));
      if(res.ok){
        console.log('✅ Synced to GitHub:', data);
      } else {
        console.log('GitHub sync failed:', data);
      }
    }catch(e){ console.log('sync error', e); }
    finally{ isSyncing=false; }
  }
  // Watch for product changes
  var lastProducts = localStorage.getItem('alamgir_products');
  setInterval(function(){
    var current = localStorage.getItem('alamgir_products');
    if(current && current !== lastProducts){
      lastProducts = current;
      // debounce
      setTimeout(syncToGithub, 1000);
    }
  }, 2000);
  // Also hook after admin adds product (listen to storage)
  window.addEventListener('storage', function(e){
    if(e.key==='alamgir_products'){
      setTimeout(syncToGithub, 1000);
    }
  });
  // Expose manual sync
  window.syncProductsToGithub = syncToGithub;
})();
</script>
